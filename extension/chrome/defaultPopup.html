<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EatWord</title>
    <link rel="stylesheet" href="./defaultPopup.css" />
  </head>
  <body>
    <!-- Header section -->
    <header>
      <div class="logo-container" id="logoContainer">
        <img src="./assets/logo.png" alt="eat word brand logo" />
      </div>
      <button class="auth-button" id="authButton">Log in</button>
    </header>
    <main>
      <!-- Feature Toggles -->
      <div class="feature-section">
        <h3 class="feature-title">Spell Check</h3>
        <p class="feature-description">
          Enable/disable spell checking for this site.
        </p>
        <div class="toggle-container">
          <input class="toggle-input" id="spellCheckToggle" type="checkbox" />
          <label
            class="toggle-label"
            for="spellCheckToggle"
            aria-label="Toggle Spell Check"
          >
            <svg
              class="toggle-icon toggle-icon-on"
              version="1.1"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 130.2 130.2"
            >
              <polyline
                class="path check"
                points="100.2,40.2 51.5,88.8 29.8,67.5"
              ></polyline>
            </svg>
            <svg
              class="toggle-icon toggle-icon-off"
              version="1.1"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 130.2 130.2"
            >
              <line
                class="path line"
                x1="34.4"
                y1="34.4"
                x2="95.8"
                y2="95.8"
              ></line>
              <line
                class="path line"
                x1="95.8"
                y1="34.4"
                x2="34.4"
                y2="95.8"
              ></line>
            </svg>
          </label>
        </div>
      </div>

      <div class="feature-section">
        <h3 class="feature-title">Translation</h3>
        <p class="feature-description">
          Enable/disable translation for this site.
        </p>
        <div class="toggle-container">
          <input class="toggle-input" id="translationToggle" type="checkbox" />
          <label
            class="toggle-label"
            for="translationToggle"
            aria-label="Toggle Translation"
          >
            <svg
              class="toggle-icon toggle-icon-on"
              version="1.1"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 130.2 130.2"
            >
              <polyline
                class="path check"
                points="100.2,40.2 51.5,88.8 29.8,67.5"
              ></polyline>
            </svg>
            <svg
              class="toggle-icon toggle-icon-off"
              version="1.1"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 130.2 130.2"
            >
              <line
                class="path line"
                x1="34.4"
                y1="34.4"
                x2="95.8"
                y2="95.8"
              ></line>
              <line
                class="path line"
                x1="95.8"
                y1="34.4"
                x2="34.4"
                y2="95.8"
              ></line>
            </svg>
          </label>
        </div>
      </div>
    </main>
    <footer class="footer">
      @ 2025 Eat Word - AI powered vocabulary mastery
    </footer>
    <script src="./defaultPopup.js"></script>
  </body>
</html>
